<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .card-1 { animation: float1 7s ease-in-out infinite; transform-origin: center; }
      .card-2 { animation: float2 9s ease-in-out infinite; transform-origin: center; }
      .halo-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 300px 180px; }
      .flow-line { stroke-dasharray: 6 6; animation: dashMove 2.5s linear infinite; }
      .cursor { animation: blinkCursor 1s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="12"/>
  <rect width="1200" height="360" fill="url(#grid)" rx="12"/>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle cx="280" cy="180" r="180" fill="#3b82f6" opacity="0.18" filter="url(#glow)" class="halo-glow"/>
  <circle cx="950" cy="180" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="halo-glow"/>

  <!-- Animated Data Flow Line in Background -->
  <path d="M 100 290 Q 300 330 500 280 T 900 300 T 1150 260" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" class="flow-line"/>

  <!-- Floating Ambient Decorative Cards (Right Side / Safe Area) -->
  <g class="card-1">
    <rect x="830" y="55" width="310" height="90" rx="10" fill="url(#glow-card)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="860" cy="85" r="14" fill="#0284c7" opacity="0.3"/>
    <circle cx="860" cy="85" r="7" fill="#38bdf8"/>
    <text x="890" y="82" fill="#f8fafc" font-size="14" font-weight="700">Live Browser Recorder</text>
    <text x="890" y="103" fill="#94a3b8" font-size="12">Codegen · Playwright · Self-Healing</text>
    <rect x="890" y="117" width="120" height="14" rx="4" fill="#0369a1" opacity="0.4"/>
    <text x="896" y="128" fill="#38bdf8" font-size="10" font-weight="600">● 60 FPS RECORDING</text>
  </g>

  <g class="card-2">
    <rect x="860" y="175" width="290" height="110" rx="10" fill="url(#glow-card)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="890" cy="205" r="14" fill="#4f46e5" opacity="0.3"/>
    <polygon points="887,199 897,205 887,211" fill="#818cf8"/>
    <text x="920" y="202" fill="#f8fafc" font-size="14" font-weight="700">Autonomous Execution</text>
    <text x="920" y="223" fill="#94a3b8" font-size="12">Low-Code &amp; AI-Powered Vision</text>
    <!-- Code pill simulator -->
    <rect x="920" y="238" width="180" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5"/>
    <text x="930" y="254" fill="#a5b4fc" font-size="11" font-family="monospace">click("Sign In") &gt;&gt; PASS</text>
  </g>

  <!-- FOREGROUND: Titles and Primary Value Proposition (Clear and Untouched) -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981"/>
      <text x="30" y="20" fill="#93c5fd" font-size="12" font-weight="600" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome Low-Code
    </text>
    <text x="0" y="188" fill="url(#accent-cyan)" font-size="38" font-weight="800" letter-spacing="-0.5">
      Test Automation &amp; Recording
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="234" fill="#cbd5e1" font-size="16" font-weight="400">
      Visual recorders, AI-driven codeless studios, &amp; autonomous self-healing engines
    </text>
    <text x="0" y="258" fill="#94a3b8" font-size="14" font-weight="400">
      Comparing SaaS giants and top open-source frameworks for high-velocity QA
    </text>

    <!-- Quick Stats Feature Tags -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="112" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="12" y="17" fill="#e2e8f0" font-size="11" font-weight="600">🎯 SaaS Tiers</text>

      <rect x="122" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="134" y="17" fill="#e2e8f0" font-size="11" font-weight="600">💻 Open-Source</text>

      <rect x="270" y="0" width="144" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="282" y="17" fill="#e2e8f0" font-size="11" font-weight="600">🤖 AI Self-Healing</text>

      <rect x="424" y="0" width="128" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="436" y="17" fill="#e2e8f0" font-size="11" font-weight="600">📈 Market Trends</text>
    </g>
  </g>
</svg>
